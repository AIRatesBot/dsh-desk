name: DSH run backtest

on:
  workflow_dispatch:
    inputs:
      strategy:
        description: "Strategy name"
        required: true
        default: "sma_cross_btc"
      alpha:
        description: "Alpha source (mom/carry/rv/vol)"
        required: true
        default: "mom"

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        timeout-minutes: 5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
        timeout-minutes: 5

      - name: Install dependencies
        timeout-minutes: 8
        run: |
          pip install --upgrade pip
          pip install vectorbt yfinance psycopg2-binary deflated-sharpe

      - name: Run backtest
        timeout-minutes: 10
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          STRATEGY:     ${{ github.event.inputs.strategy }}
          ALPHA:        ${{ github.event.inputs.alpha }}
        run: python backtest.py
